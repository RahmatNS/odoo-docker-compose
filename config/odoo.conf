[options]
; ===============================
; DATABASE CONNECTION
; ===============================
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_db_password
db_name = False

; ===============================
; PATHS & ADDONS
; ===============================
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; ===============================
; REVERSE PROXY CONFIG
; ===============================
; Set False karena tidak menggunakan Nginx / Reverse Proxy
proxy_mode = False

; ===============================
; PORTS & NETWORK
; ===============================
http_port = 8069
gevent_port = 8072

; ===============================
; LIMITS & PERFORMANCE
; ===============================
workers = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; ===============================
; LOGGING
; ===============================
log_level = info
logfile = False