services:
  web:
    image: odoo:18.0  # atau versi Odoo yang digunakan
    container_name: odoo_app
    depends_on:
      - db
    ports:
      - "8069:8069"   # Port HTTP / Web Utama
      - "8072:8072"   # Port Longpolling / Websocket Chat
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_db_password
    restart: always

  db:
    image: postgres:15
    container_name: odoo_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_db_password
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always

volumes:
  odoo-web-data:
  odoo-db-data: